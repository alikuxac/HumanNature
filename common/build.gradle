plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

group = rootProject.mod_group_id
version = rootProject.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
    withSourcesJar()
}

neoForge {
    version = rootProject.neo_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft_version
        mappingsVersion = rootProject.parchment_mappings_version
    }
}

var generateBuildConstants = tasks.register('generateBuildConstants') {
    var outputDir = layout.buildDirectory.dir("generated/sources/buildConstants")
    inputs.property('mod_id', rootProject.mod_id)
    inputs.property('mod_name', rootProject.mod_name)
    inputs.property('mod_version', rootProject.mod_version)
    outputs.dir(outputDir)

    doLast {
        var file = outputDir.get().file("com/alikuxac/humannature/BuildConstants.java").asFile
        file.parentFile.mkdirs()
        file.text = """package com.alikuxac.humannature;

public class BuildConstants {
    public static final String MOD_ID = "${rootProject.mod_id}";
    public static final String MOD_NAME = "${rootProject.mod_name}";
    public static final String MOD_VERSION = "${rootProject.mod_version}";
}
"""
    }
}

sourceSets.main.java.srcDir(generateBuildConstants)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
