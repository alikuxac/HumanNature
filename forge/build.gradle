plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.+'
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version

    runs {
        client {
            workingDir = file('run')
            systemProperties['forge.logging.markers'] = 'REGISTRIES'
            systemProperties['forge.logging.console.level'] = 'debug'
        }

        server {
            workingDir = file('run')
            args '--nogui'
            systemProperties['forge.logging.markers'] = 'REGISTRIES'
            systemProperties['forge.logging.console.level'] = 'debug'
        }
    }
}

repositories {
    minecraft.mavenizer(repositories)
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}")
    implementation project(':common')
}



tasks.named('jar', Jar) {
    archiveFileName = "${rootProject.mod_id}-${rootProject.mod_version}+mc${rootProject.minecraft_version}-forge.jar"
    from project(':common').sourceSets.main.output
    manifest {
        attributes([
            'Specification-Title'     : rootProject.mod_id,
            'Specification-Vendor'    : 'alikuxac',
            'Specification-Version'   : '1',
            'Implementation-Title'    : rootProject.mod_name,
            'Implementation-Version'  : rootProject.mod_version,
            'Implementation-Vendor'   : 'alikuxac',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            forge_version          : rootProject.forge_version,
            forge_version_range    : rootProject.forge_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_version            : rootProject.mod_version,
            version                : rootProject.mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
