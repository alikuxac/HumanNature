plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

def isJitPack = "true" == System.getenv("JITPACK")
def rawVersion = System.getenv("VERSION") ?: (project.findProperty("mod_version") ?: rootProject.mod_version)
def publishVersion = rawVersion ? rawVersion.replaceFirst('^v', '') : rootProject.mod_version
def publishGroup = System.getenv("GROUP") ?: (isJitPack ? "com.github.alikuxac.HumanNature" : rootProject.mod_group_id)

version = publishVersion
group = publishGroup

base {
    archivesName = "${rootProject.mod_id}-api"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
    withSourcesJar()
}

neoForge {
    version = rootProject.neo_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft_version
        mappingsVersion = rootProject.parchment_mappings_version
    }
}

tasks.named('jar', Jar) {
    enabled = isJitPack
    archiveFileName = "${rootProject.mod_id}-api-${publishVersion}.jar"
}

tasks.named('sourcesJar', Jar) {
    enabled = isJitPack
    archiveFileName = "${rootProject.mod_id}-api-${publishVersion}-sources.jar"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = publishGroup
            artifactId = "${rootProject.mod_id}-api"
            version = publishVersion
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

