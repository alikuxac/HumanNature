subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
        maven { name = "Mojang"; url = 'https://libraries.minecraft.net/' }
        maven { name = "Forge"; url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { name = "Illusive Soulworks maven"; url = "https://maven.theillusivec4.top/" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
        maven { name = "Latvian"; url = "https://maven.latvian.dev/releases" }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}
